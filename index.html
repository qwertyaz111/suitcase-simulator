<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🧳キャリーケースシミュレーター</title>
    <style>
        :root { --panel-width: 300px; }
        body { margin: 0; font-family: 'Helvetica Neue', Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif; background: #ffffff; overflow: hidden; }
        #ui-panel {
            position: absolute; top: 10px; left: 10px; width: var(--panel-width);
            max-height: calc(100vh - 20px); max-height: calc(100dvh - 20px);
            background: rgba(255, 255, 255, 0.95); padding: 15px; padding-bottom: 40px;
            border-radius: 15px; z-index: 100; box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            overflow-y: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y;
            border: 1px solid rgba(255,255,255,0.3); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            box-sizing: border-box; transition: all 0.2s ease-out;
        }
        #canvas-container { width: 100vw; height: 100vh; cursor: move; touch-action: none; }
        @media screen and (max-width: 480px) {
            :root { --panel-width: calc(100vw - 20px); }
            #ui-panel { left: 10px; right: 10px; }
        }
        @media screen and (orientation: landscape) and (max-height: 500px) {
            :root { --panel-width: 260px; }
            #ui-panel { top: 5px; left: 5px; padding: 10px; max-height: calc(100vh - 10px); }
            .app-title { font-size: 1.1rem; }
            .input-group { padding: 8px; margin-bottom: 5px; }
        }
        .panel-header {
            display: flex; justify-content: space-between; align-items: center; cursor: pointer; user-select: none; gap: 10px;
            position: sticky; top: -15px; background: rgba(255, 255, 255, 0.95);
            padding: 10px 0; margin: -15px -15px 10px -15px; padding-left: 15px; padding-right: 15px;
            z-index: 10; border-bottom: 1px solid rgba(0,0,0,0.05);
        }
        #toggle-text { font-size: 12px; font-weight: bold; color: #666; background: #eee; padding: 4px 10px; border-radius: 10px; white-space: nowrap; }
        .collapsed #ui-content { display: none; }
        .app-title { font-size: 1.2rem; margin: 0; color: #333; font-weight: bold; white-space: nowrap; }
        .app-description { font-size: 11px; color: #777; margin-top: 8px; margin-bottom: 5px; line-height: 1.5; text-align: center; }
        .input-group { display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: 12px; margin-bottom: 10px; }
        .group-a { background: #fff5f0; border: 1px solid #ffe0d0; }
        .group-b { background: #f0f7ff; border: 1px solid #d0e7ff; }
        .group-s { background: #f5f5f5; border: 1px solid #e0e0e0; }
        .group-layout { background: #f9f9f9; border: 1px solid #eee; }
        .section-header { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
        .section-header strong { font-size: 15px; color: #444; }
        .input-row { display: flex; gap: 8px; align-items: flex-end; width: 100%; }
        .input-item { display: flex; flex-direction: column; flex: 1; min-width: 0; }
        .hint { font-size: 10px; color: #999; margin-bottom: 2px; font-weight: bold; }
        input, select { padding: 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; background: white; color: #333; width: 100%; box-sizing: border-box; }
        .radio-switch { display:flex; gap:4px; background:#eee; padding:3px; border-radius:8px; margin-top:2px }
        .radio-switch label { flex:1; text-align:center; font-size:11px; font-weight:bold; padding:6px 0; border-radius:6px; cursor:pointer; color:#666; transition:.2s; user-select:none }
        .radio-switch input { display:none }
        .radio-switch input:checked + label { background:#fff; color:#333; box-shadow:0 2px 4px rgba(0,0,0,.1) }
        input[type="number"]::-webkit-outer-spin-button, input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type="number"] { -moz-appearance: textfield; }
        .color-picker { width: 100%; height: 38px; border: 2px solid #999; border-radius: 4px; cursor: pointer; padding: 0; background: none; appearance: none; -webkit-appearance: none; }
        .switch-btn { width: 100%; padding: 12px; background: #333; color: white; border: none; border-radius: 25px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 14px; -webkit-tap-highlight-color: transparent; margin-bottom: 10px; }
        .switch-btn:active { background: #000; transform: scale(0.98); }
        .swap-btn { margin-bottom: 5px; }
        .share-btn { width: 100%; padding: 12px; background: #000; color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 13px; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; margin-top: 10px; }
        .share-btn:active { transform: scale(0.98); opacity: 0.8; }
        .other-tools-link { margin-top: 20px; padding: 10px; background: #f9f9f9; border-radius: 10px; text-align: center; }
        .other-tools-link a { text-decoration: none; color: #333; font-size: 12px; font-weight: bold; border: 2px solid #333; padding: 8px 15px; border-radius: 30px; display: inline-block; transition: 0.3s; margin: 4px; }
        .other-tools-link a:hover { background: #333; color: #fff; }
        .usage-notes { font-size: 10px; color: #999; margin-top: 12px; line-height: 1.5; text-align: center; }
        .group-note { font-size: 10px; color: #999; margin-top: 6px; line-height: 1.5; }
        .info-box { background: #ffffff; padding: 15px; border-radius: 12px; margin-top: 12px; border: 1px solid #eee; box-shadow: inset 0 2px 4px rgba(0,0,0,0.02); }
        .info-row { display: flex; justify-content: space-between; align-items: baseline; padding: 6px 0; }
        .info-row:not(:last-child) { border-bottom: 1px dashed #eee; margin-bottom: 4px; }
        .info-label { color: #555; font-size: 12px; font-weight: bold; display: flex; align-items: center; gap: 4px; }
        .info-value { font-weight: 800; font-size: 18px; color: #2c3e50; font-variant-numeric: tabular-nums; }
        .unit { font-size: 11px; margin-left: 3px; color: #7f8c8d; font-weight: normal; }
        .info-desc { font-size: 12px; color: #444; line-height: 1.6; padding: 6px 0; }
        #view-label { position: absolute; bottom: 20px; right: 15px; background: rgba(0,0,0,0.7); color: white; padding: 8px 16px; border-radius: 20px; font-size: 12px; font-weight: bold; z-index: 90; pointer-events: none; }
        .crosshair { position: absolute; top: 50%; left: 50%; width: 20px; height: 20px; border: 2px solid rgba(0,0,0,0.15); border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; }
        #ui-panel.collapsed { max-height: none !important; padding: 10px 15px !important; overflow: hidden !important; width: auto; max-width: calc(100vw - 20px); }
        @media screen and (max-width: 480px) { #ui-panel.collapsed { right: auto; } }
    </style>
</head>
<body>

<div id="ui-panel">
    <div class="panel-header" onclick="togglePanel()">
        <h1 class="app-title">🧳キャリーケース<br>シミュレーター</h1>
        <span id="toggle-text">閉じる</span>
    </div>

    <div id="ui-content">
        <p class="app-description">キャリーケースと体格差をシミュレートします。</p>

        <div class="input-group group-a">
            <div class="section-header"><strong>A</strong></div>
            <div class="input-row">
                <div class="input-item"><span class="hint">名前</span><input type="text" id="nameA" placeholder="名前A" oninput="updateScene()"></div>
                <div class="input-item" style="flex: 0.6;"><span class="hint">性別</span><select id="genderA" onchange="updateScene()"><option value="male">男</option><option value="female" selected>女</option></select></div>
            </div>
            <div class="input-row">
                <div class="input-item"><span class="hint">身長 (cm)</span><input type="number" id="heightA" value="158.0" step="0.1" oninput="updateScene()"></div>
                <div class="input-item" style="flex: 0.35;"><span class="hint">色</span><input type="color" id="colorA" class="color-picker" value="#ffcc99" oninput="updateScene()"></div>
            </div>
        </div>

        <div class="input-group group-b" id="panel-group-b">
            <div class="section-header"><strong>B</strong></div>
            <div class="input-row">
                <div class="input-item"><span class="hint">名前</span><input type="text" id="nameB" placeholder="名前B" oninput="updateScene()"></div>
                <div class="input-item" style="flex: 0.6;"><span class="hint">性別</span><select id="genderB" onchange="updateScene()"><option value="male" selected>男</option><option value="female">女</option></select></div>
            </div>
            <div class="input-row">
                <div class="input-item"><span class="hint">身長 (cm)</span><input type="number" id="heightB" value="171.5" step="0.1" oninput="updateScene()"></div>
                <div class="input-item" style="flex: 0.35;"><span class="hint">色</span><input type="color" id="colorB" class="color-picker" value="#ffad60" oninput="updateScene()"></div>
            </div>
        </div>

        <div class="input-group group-s">
            <div class="section-header"><strong>スーツケースの設定</strong></div>
            <div class="input-item"><span class="hint">Aのスーツケースの色</span><input type="color" id="colorCaseA" class="color-picker" value="#d14d6e" oninput="updateScene()"></div>
            <div class="input-item">
                <span class="hint">Aの大きさ</span>
                <div class="radio-switch">
                    <input type="radio" id="radio-sizeA-fit" name="sizeA" value="fit" checked onchange="setSizeA('fit')"><label for="radio-sizeA-fit">身の丈</label>
                    <input type="radio" id="radio-sizeA-s" name="sizeA" value="S" onchange="setSizeA('S')"><label for="radio-sizeA-s">S</label>
                    <input type="radio" id="radio-sizeA-m" name="sizeA" value="M" onchange="setSizeA('M')"><label for="radio-sizeA-m">M</label>
                    <input type="radio" id="radio-sizeA-l" name="sizeA" value="L" onchange="setSizeA('L')"><label for="radio-sizeA-l">L</label>
                </div>
            </div>
            <div class="input-item"><span class="hint">Bのスーツケースの色</span><input type="color" id="colorCaseB" class="color-picker" value="#3a5a78" oninput="updateScene()"></div>
            <div class="input-item">
                <span class="hint">Bの大きさ</span>
                <div class="radio-switch">
                    <input type="radio" id="radio-sizeB-fit" name="sizeB" value="fit" checked onchange="setSizeB('fit')"><label for="radio-sizeB-fit">身の丈</label>
                    <input type="radio" id="radio-sizeB-s" name="sizeB" value="S" onchange="setSizeB('S')"><label for="radio-sizeB-s">S</label>
                    <input type="radio" id="radio-sizeB-m" name="sizeB" value="M" onchange="setSizeB('M')"><label for="radio-sizeB-m">M</label>
                    <input type="radio" id="radio-sizeB-l" name="sizeB" value="L" onchange="setSizeB('L')"><label for="radio-sizeB-l">L</label>
                </div>
            </div>
        </div>

        <div class="input-group" style="background: #f8f8f8; border: 1px solid #eee;">
            <div class="section-header"><strong>アニメーション</strong></div>
            <div class="radio-switch">
                <input type="radio" id="radio-anim-none" name="anim" value="none" checked onchange="setAnimMode('none')"><label for="radio-anim-none">停止</label>
                <input type="radio" id="radio-anim-play" name="anim" value="play" onchange="setAnimMode('play')"><label for="radio-anim-play">アニメーション</label>
            </div>
            <div class="group-note">※アニメーションは設定タブを閉じると始まります</div>
        </div>

        <div class="input-group group-layout" style="gap:5px">
            <div class="section-header"><strong>シチュエーション</strong></div>
            <div class="input-item">
                <span class="hint">モード</span>
                <div class="radio-switch">
                    <input type="radio" id="radio-mode-stairs" name="mode" value="stairs" checked onchange="setMode('stairs')"><label for="radio-mode-stairs">階段で持つ</label>
                    <input type="radio" id="radio-mode-pull" name="mode" value="pull" onchange="setMode('pull')"><label for="radio-mode-pull">引いて歩く</label>
                </div>
            </div>
            <div class="input-item" id="item-pullpos" style="transition: opacity 0.3s; opacity: 0.3; pointer-events: none;">
                <span class="hint">引く位置</span>
                <div class="radio-switch">
                    <input type="radio" id="radio-pullpos-back" name="pullpos" value="back" checked onchange="setPullPos('back')"><label for="radio-pullpos-back">後ろに引く</label>
                    <input type="radio" id="radio-pullpos-side" name="pullpos" value="side" onchange="setPullPos('side')"><label for="radio-pullpos-side">横につける</label>
                </div>
            </div>
            <div class="input-item">
                <span class="hint">持ち方</span>
                <div class="radio-switch">
                    <input type="radio" id="radio-pat-one" name="pattern" value="one" checked onchange="setPattern('one')"><label for="radio-pat-one" id="lbl-pat-one">片方が持つ</label>
                    <input type="radio" id="radio-pat-each" name="pattern" value="each" onchange="setPattern('each')"><label for="radio-pat-each" id="lbl-pat-each">それぞれが持つ</label>
                </div>
            </div>
            <div class="input-item" id="item-carrier" style="transition: opacity 0.3s;">
                <span class="hint">持つ人</span>
                <div class="radio-switch">
                    <input type="radio" id="radio-carrier-a" name="carrier" value="A" onchange="setCarrier('A')"><label for="radio-carrier-a" id="lbl-carrier-a">Aが持つ</label>
                    <input type="radio" id="radio-carrier-b" name="carrier" value="B" checked onchange="setCarrier('B')"><label for="radio-carrier-b" id="lbl-carrier-b">Bが持つ</label>
                </div>
            </div>
            <div class="input-item" id="item-dir" style="transition: opacity 0.3s;">
                <span class="hint">方向</span>
                <div class="radio-switch">
                    <input type="radio" id="radio-dir-up" name="dir" value="up" checked onchange="setDir('up')"><label for="radio-dir-up">上り</label>
                    <input type="radio" id="radio-dir-down" name="dir" value="down" onchange="setDir('down')"><label for="radio-dir-down">下り</label>
                </div>
            </div>
        </div>

        <div style="padding: 0 5px;">
            <button class="switch-btn swap-btn" id="btn-swap" onclick="swapAB()">⇄ AとBを入れ替える</button>
            <button class="switch-btn" onclick="switchView()">🔄 視点を切り替える</button>
        </div>

        <div id="info-container">
            <div class="info-box" id="info"></div>
            <button class="share-btn" onclick="shareToX()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"></path></svg>で結果をシェアする
            </button>
            <div class="other-tools-link">
                <p style="font-size: 10px; color: #888; margin-bottom: 8px;">こちらもチェック❣🤩</p>
                <a href="https://qwertyaz111.github.io/my-site-hub/">ツール・シミュレーター一覧</a>
            </div>
            <div class="usage-notes">
                スクショ投稿や加工、トレース等はご自由にお楽しみください。<br>
                ※営利目的や商用利用はご遠慮ください。
            </div>
        </div>
    </div>
</div>

<div id="view-label"></div>
<div class="crosshair" id="crosshair" style="display:none;"></div>
<div id="canvas-container"></div>

<script type="module">
    import * as THREE from 'https://unpkg.com/three@0.158.0/build/three.module.js';

    let scene, camera, renderer;
    let personA, personB, envGroup, caseGroup, stageGroup;
    let caseAObj = null, caseBObj = null;
    let currentView = '3rd';
    let rotation = { x: 0.06, y: Math.PI / 2 - 0.15 }, camDist = 3.4, isDragging = false, previousTouch = null;
    let viewCenter = new THREE.Vector3(0.15, 1.05, 1.15);
    const measure = {};
    const WHEEL_DROP = 0.035; // ケース中心から車輪底までの H/2 以外の落差
    const CLR_TGT = 0.025; // 階段でケース底が段面から確保する目標クリアランス（m）。2.5cm: ユーザー指示「現実ではもう少し持ち上げる」で 1.5cm から引き上げ（2026-11-20）。3.0cm では下り flight2 で担当者の肘が 110.1° と上限（110°）を超えたため 2.5cm に決定。肘中央値は arm1 46°／arm0 71°（抱え上げと指摘された 110° とは大きく離れている）
    const CLR_EXTRA = 0.020; // 浮きの底上げ（2026-11-20 追加: ユーザー「現実は4〜5cm浮いている場面が多い」。同日さらに「もう少し高く持ち上げられる？」で 1.5→2.0cm へ引き上げ、目標合計は CLR_TGT と合わせて 4.0→4.5cm）。最小保証は CLR_TGT=2.5cm のまま、liftCorr の目標にだけ上乗せし、拘束局面の典型浮きを引き上げる。実測（デフォルト構成・実段面基準）: 拘束局面の p10 が上り 4.04→4.54cm／下り 3.98→4.48cm、フライト最小浮き 2.98→3.48cm、全構成スイープ最小 2.91→3.41cm、手誤差 0.00mm。律速は下り arm1（caseA側）の肘最大で 106.8→107.6°（1/240 細サンプル 107.8°）——「抱え上げ」と指摘された 110° まで 2.2° の余裕を残す。合計 5.0cm では 108.5°（余裕 1.5°）、5.5cm では 109.3° まで迫るため不採用。なお下り arm1 は引き上げ前でも 106.9° あり、下りの幾何が律速（上りは最大でも arm0 96.4°）。肘中央値は上り 67°／46°・下り 52°／81°。CLR_TGT 自体を上げる案は 3.0cm で肘 110.1° 超えの前例があるため採らず、上乗せ分は carryLift 等で既に足りている局面では liftCorr が残差化して二重に効かない。沈みの床クランプ（1.05cm）は底上げ後も全構成スイープで合格ライン +1.0cm を維持することを再確認済み
    const ANKLE_Y = 0.055;

    /* ================= アニメーション / 駅階段プロファイル ================= */
    let gridHelper = null;
    let animTime = 0, animPlaying = false; // デフォルトは停止（初期ポーズは t=0 の地面）
    const animClock = new THREE.Clock();
    let layout = null;
    let lastFeet = null; // 直近の applyStairs の足首目標（検証用）
    const STAIR_H = 0.16, STAIR_D = 0.32, STAIR_STEPS = 15;
    const LAND_D = STAIR_D * 4, STAIR_W = 4.0;
    const FLIGHT1_Z0 = 0, LAND_Z0 = STAIR_STEPS * STAIR_D, FLIGHT2_Z0 = LAND_Z0 + LAND_D;
    const TOP_Z0 = FLIGHT2_Z0 + STAIR_STEPS * STAIR_D, TOP_H = STAIR_H * STAIR_STEPS * 2;
    /* 水平位置 z → その真下の段面（床面）の高さ */
    function heightAt(z) {
        if (z < FLIGHT1_Z0) return 0;
        if (z < LAND_Z0) return (Math.floor((z - FLIGHT1_Z0) / STAIR_D) + 1) * STAIR_H;
        if (z < FLIGHT2_Z0) return STAIR_H * STAIR_STEPS;
        if (z < TOP_Z0) return STAIR_H * STAIR_STEPS + (Math.floor((z - FLIGHT2_Z0) / STAIR_D) + 1) * STAIR_H;
        return TOP_H;
    }
    /* 段鼻の手前0.12mから次の段面へ smoothstep でつないだ段面（zに対して連続。足・ケースの先読み用） */
    function rampHeightAt(z) {
        const h0 = heightAt(z);
        if (heightAt(z + 0.12) <= h0) return h0;
        let lo = 0, hi = 0.12;
        for (let it = 0; it < 10; it++) { const mid = (lo + hi) / 2; if (heightAt(z + mid) > h0) hi = mid; else lo = mid; } // 10回で分解能0.3mm（6回=4.7mmではランプ目標が階段状になりケース高さが小刻みに跳ぶ）
        const u = Math.max(0, 1 - hi / 0.12);
        return h0 + (heightAt(z + 0.12) - h0) * (u * u * (3 - 2 * u));
    }
    /* 段ごとの微妙な個体差（決定的ハッシュ: 同じ段はいつも同じ値。単調な繰り返しを崩すため） */
    function stepVary(n) { const x = Math.sin(n * 12.9898) * 43758.5453; return x - Math.floor(x); }
    const CYCLE_T = 35;
    let tactStepBands = [], tactLandBands = []; // 黄色い帯の中心z（検証用）
    /* [時刻s, z位置m] のキーフレーム。Bは両手に合計32kg相当を持つので遅め、Aは後ろから追う */
    const SCHED_B = [[0, -1.7], [1.62, 0], [15.12, 4.8], [16.72, 6.08], [30.22, 10.88], [31.84, 12.5], [CYCLE_T, 12.5]];
    const SCHED_A = [[0, -3.4], [3.9, -0.291], [18.7, 5.091], [19.35, 5.789], [34.15, 11.171], [34.5, 11.45], [CYCLE_T, 11.45]]; // 交互足（参考版の区間構成）: フライトは入口0.8s＋15段×0.88s＋出口0.8s＝14.8s、体の進みは1段0.32m/0.88s。フライト入口は段の手前0.291m、出口は踊り場・上の階へ0.291m進んだ位置。差分（参考版37秒→35秒）はアプローチ／踊り場／上の階で吸収。アプローチは担当者との間隔（ケースへの接近回避）のため少し長め
    function schedZ(sched, t) {
        if (t <= sched[0][0]) return sched[0][1];
        for (let i = 0; i < sched.length - 1; i++) {
            const [t0, z0] = sched[i], [t1, z1] = sched[i + 1];
            if (t <= t1) return z0 + (z1 - z0) * ((t - t0) / Math.max(t1 - t0, 1e-9));
        }
        return sched[sched.length - 1][1];
    }
    function schedSeg(sched, t) {
        for (let i = 0; i < sched.length - 1; i++) { if (t < sched[i + 1][0]) return i; }
        return sched.length - 2;
    }
    function clamp01(x) { return Math.max(0, Math.min(1, x)); }
    function smooth01(x) { x = clamp01(x); return x * x * (3 - 2 * x); }
    /* 補正付き平滑 max（a=b でバイアス0、微分連続、真の max からのはみ出しは最大でも ~0.02k）。素の max の切替キンクを消す用 */
    function smaxC(a, b, k) { const s = (a + b + Math.sqrt((a - b) * (a - b) + k * k)) / 2; const dq = (a - b) / k; return s - (k / 2) * Math.exp(-dq * dq); }
    /* 歩行1周期ぶんの片脚プロファイル: 支持期60% / スイング期40%。
       u=位相[0,1)、amp=前後振幅(m)。スイングは離地を速く・着地前に減速するイージング、支持は等速で後方へ */
    const GAIT_SWING = 0.4;
    function gaitLeg(u, amp) {
        u = ((u % 1) + 1) % 1;
        if (u < GAIT_SWING) {
            const s = u / GAIT_SWING;
            const e = 1 - Math.pow(1 - s, 2.2);
            return { z: -amp + 2 * amp * e, lift: Math.sin(s * Math.PI) };
        }
        const s = (u - GAIT_SWING) / (1 - GAIT_SWING);
        return { z: amp - 2 * amp * s, lift: 0 };
    }

    /* ================= ケースのサイズ規則（前回版から継承） ================= */
    function fitCase(heightCm){
        if (heightCm < 150) return { h:54, vol:36, kg:12 };
        if (heightCm < 160) return { h:60, vol:48, kg:14 };
        if (heightCm < 170) return { h:66, vol:62, kg:16 };
        if (heightCm < 180) return { h:72, vol:78, kg:18 };
        return { h:76, vol:90, kg:20 };
    }
    function caseFor(heightCm, sizeType){
        if (sizeType === 'S') return { h:54, vol:36, kg:12 };
        if (sizeType === 'M') return { h:66, vol:62, kg:16 };
        if (sizeType === 'L') return { h:80, vol:100, kg:22 };
        return fitCase(heightCm);
    }
    function caseDims(spec){
        const H = spec.h / 100;
        return { H: H, W: H * 0.66, D: H * 0.42 };
    }

    /* ================= マネキン（お座りシミュレーターの実モデルを移植し、脚もIK化） ================= */
    function createMannequin(color, heightCm, gender, name, role) {
        const group = new THREE.Group();
        const h = heightCm * 0.01;
        const bodyMat = new THREE.MeshPhongMaterial({ color: color, transparent: true, opacity: 0.85 });
        const eyeMat = new THREE.MeshBasicMaterial({ color: 0x222222 });

        const headH = h * 0.13, neckH = h * 0.05, torsoH = h * 0.37, legH = h * 0.45;
        const torsoW = (gender === 'male' ? 0.26 : 0.21) * (h / 1.7);
        const torsoDepth = torsoW * 0.5;

        const bodyGroup = new THREE.Group();
        bodyGroup.position.y = legH;

        const torso = new THREE.Mesh(new THREE.BoxGeometry(torsoW, torsoH, torsoDepth), bodyMat);
        torso.position.y = torsoH * 0.5;
        bodyGroup.add(torso);

        const neck = new THREE.Mesh(new THREE.CylinderGeometry(headH * 0.3, headH * 0.3, neckH, 16), bodyMat);
        neck.position.y = torsoH + (neckH * 0.5);
        bodyGroup.add(neck);

        const localEyeY = torsoH + neckH + (headH * 0.3);
        const headBox = new THREE.Group();
        headBox.position.y = localEyeY;
        const head = new THREE.Mesh(new THREE.SphereGeometry(headH * 0.8, 16, 16), bodyMat);
        head.position.y = (headH * 0.5) - (headH * 0.3);
        headBox.add(head);
        [-1, 1].forEach(side => {
            const eye = new THREE.Mesh(new THREE.SphereGeometry(headH * 0.12, 12, 12), eyeMat);
            eye.position.set(side * (headH * 0.28), (headH * 0.5) - (headH * 0.3), (headH * 0.7));
            headBox.add(eye);
        });
        bodyGroup.add(headBox);
        group.headParts = headBox;
        group.bodyGroup = bodyGroup;

        group.arms = [];
        [-1, 1].forEach(side => {
            const anchor = new THREE.Group();
            anchor.position.set(side * (torsoW * 0.6), torsoH - (torsoW * 0.15), 0);
            const armLen = h * 0.38;
            const upperLen = armLen * 0.54, foreLen = armLen * 0.51;
            const upper = new THREE.Mesh(new THREE.BoxGeometry(torsoW * 0.3, upperLen, torsoW * 0.3), bodyMat);
            upper.position.y = -upperLen * 0.5;
            anchor.add(upper);
            const elbow = new THREE.Group();
            elbow.position.y = -upperLen;
            const fore = new THREE.Mesh(new THREE.BoxGeometry(torsoW * 0.3, foreLen, torsoW * 0.3), bodyMat);
            fore.position.y = -foreLen * 0.5;
            elbow.add(fore);
            anchor.add(elbow);
            bodyGroup.add(anchor);
            group.arms.push({ anchor: anchor, elbow: elbow, upperLen: upperLen, foreLen: foreLen, totalLen: armLen });
        });

        group.legs = [];
        const thighLen = legH * 0.5, shinLen = legH * 0.5;
        [-1, 1].forEach(side => {
            const anchor = new THREE.Group();
            anchor.position.set(side * (torsoW * 0.25), 0, 0);
            const thigh = new THREE.Mesh(new THREE.BoxGeometry(torsoW * 0.4, thighLen, torsoW * 0.4), bodyMat);
            thigh.position.y = -thighLen * 0.5;
            anchor.add(thigh);
            const knee = new THREE.Group();
            knee.position.y = -thighLen;
            const shin = new THREE.Mesh(new THREE.BoxGeometry(torsoW * 0.4, shinLen, torsoW * 0.4), bodyMat);
            shin.position.y = -shinLen * 0.5;
            knee.add(shin);
            anchor.add(knee);
            bodyGroup.add(anchor);
            group.legs.push({ anchor: anchor, elbow: knee, upperLen: thighLen, foreLen: shinLen, totalLen: legH });
        });

        group.add(bodyGroup);

        const canvas = document.createElement('canvas'); canvas.width = 512; canvas.height = 128;
        const ctx = canvas.getContext('2d'); ctx.font = "bold 45px sans-serif"; ctx.fillStyle = "#333"; ctx.textAlign = "center";
        const displayName = name || (role === 'B' ? 'B' : 'A');
        ctx.fillText(`${displayName} (${heightCm.toFixed(1)}cm)`, 256, 64);
        const spriteMaterial = new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(canvas) });
        const sprite = new THREE.Sprite(spriteMaterial);
        sprite.scale.set(1.5, 0.38, 1);
        group.add(sprite);
        group.nameTag = sprite;

        group.userData = { height: h, eyeY: legH + localEyeY, localEyeY: localEyeY, role: role, torsoW: torsoW, torsoDepth: torsoDepth, torsoH: torsoH, legH: legH, headH: headH };
        return group;
    }

    /* 汎用2ボーンIK（お座りの poseArmTo をそのまま移植。腕・脚共通）
       target は anchor の親 (bodyGroup) 内座標。pole 省略時はシリーズ標準の外側＋やや下＋後ろ */
    function poseLimbTo(limb, target, pole) {
        const S = limb.anchor.position;
        const d = new THREE.Vector3().subVectors(target, S);
        let D = d.length();
        const maxD = (limb.upperLen + limb.foreLen) * 0.999;
        if (D > maxD) { d.multiplyScalar(maxD / D); D = maxD; }
        const dir = d.clone().divideScalar(D);
        const cosA = Math.max(-1, Math.min(1, (limb.upperLen * limb.upperLen + D * D - limb.foreLen * limb.foreLen) / (2 * limb.upperLen * D)));
        const angA = Math.acos(cosA);
        const sideSign = limb.anchor.position.x >= 0 ? 1 : -1;
        const w = pole ? pole.clone() : new THREE.Vector3(sideSign * 0.8, -0.15, -0.6);
        w.addScaledVector(dir, -w.dot(dir));
        if (w.lengthSq() < 1e-6) w.set(0, 1, 0); else w.normalize();
        const u = dir.clone().multiplyScalar(Math.cos(angA)).addScaledVector(w, Math.sin(angA));
        const gamma = Math.asin(Math.max(-1, Math.min(1, u.x)));
        const theta = Math.atan2(-u.z, -u.y);
        limb.anchor.rotation.set(theta, 0, gamma);
        const E = S.clone().addScaledVector(u, limb.upperLen);
        const T = S.clone().add(d);
        const f = new THREE.Vector3().subVectors(T, E).normalize();
        const invQ = new THREE.Quaternion().setFromEuler(new THREE.Euler(theta, 0, gamma)).invert();
        const fl = f.clone().applyQuaternion(invQ);
        const gammaE = Math.asin(Math.max(-1, Math.min(1, fl.x)));
        const thetaE = Math.atan2(-fl.z, -fl.y);
        limb.elbow.rotation.set(thetaE, 0, gammaE);
    }

    function poseArmWorld(person, idx, worldTarget, pole) {
        const local = person.bodyGroup.worldToLocal(worldTarget.clone());
        poseLimbTo(person.arms[idx], local, pole);
    }
    function poseArmLocal(person, idx, localTarget, pole) {
        poseLimbTo(person.arms[idx], localTarget, pole);
    }
    function restArmLocal(person, idx) {
        const side = idx === 0 ? -1 : 1;
        const torsoW = person.userData.torsoW;
        const armLen = person.arms[idx].totalLen;
        poseArmLocal(person, idx, new THREE.Vector3(side * (torsoW * 0.6 + 0.07), -(armLen * 0.80), 0.04));
    }
    /* 空き手の自然な振り: 肩を支点に手先が対側脚と逆位相の弧を描く。
       肩→手先の距離 D で肘の曲がりを決める（前に振るほど少し曲げ、後ろでは伸び気味に）。
       walkAmt=1 で歩行振り、0 で体の横に垂らした静止ポーズへ滑らかに寄せる */
    function freeHandTarget(person, idx, gz, amp, walkAmt) {
        const arm = person.arms[idx];
        const sg = idx === 0 ? -1 : 1;
        const span = arm.upperLen + arm.foreLen;
        const shoulder = new THREE.Vector3(); arm.anchor.getWorldPosition(shoulder); // 実際の肩位置（体の傾き・回旋も反映した正確な距離で肘角を決める）
        const ry = person.rotation.y;
        const sideDir = new THREE.Vector3(Math.cos(ry), 0, -Math.sin(ry)); // 人のローカル+x軸のワールド方向
        const fwdDir = new THREE.Vector3(Math.sin(ry), 0, Math.cos(ry)); // 人の正面のワールド方向
        const fwd = amp > 0 ? Math.max(-1, Math.min(1, gz / amp)) : 0;
        const bend = 0.5 + 0.5 * fwd;
        const D = span * (0.995 - 0.010 * bend * walkAmt - 0.002 * (1 - walkAmt)); // 肘は常時わずかに曲がり、前へ振る時に少しだけ増える
        const out = 0.012; // 肩の真下よりわずかに外: 前腕が胴体ボックス下角をかすめて貫通しない最小限 // 手は肩の真下＝太ももの外側のすぐ横（外へ広げない）
        const swingZ = gz * walkAmt + 0.01 * (1 - walkAmt);
        const reach = Math.sqrt(Math.max(D * D - swingZ * swingZ - out * out, 0.01));
        return shoulder.addScaledVector(sideDir, sg * out).addScaledVector(fwdDir, swingZ).add(new THREE.Vector3(0, -reach, 0));
    }
    function swingArmWorld(person, idx) {
        const side = idx === 0 ? -1 : 1;
        const p = person.position, hipY = person.bodyGroup.position.y, torsoW = person.userData.torsoW;
        poseArmWorld(person, idx, new THREE.Vector3(p.x + side * (torsoW * 0.6 + 0.05), p.y + hipY + person.userData.height * 0.06, p.z + person.userData.height * 0.15));
    }
    /* 脚: ankle のワールド目標へ（足先メッシュはなし、シリーズ準拠） */
    function poseLegWorld(person, idx, ankleWorld, footPitch) {
        const side = idx === 0 ? -1 : 1;
        const local = person.bodyGroup.worldToLocal(ankleWorld.clone());
        poseLimbTo(person.legs[idx], local, new THREE.Vector3(side * 0.04, 0, 1)); // 膝は足先の真上を通る（外へ張り出させない: がに股防止に外側成分は最小限、前主体）
    }
    function standingLegs(person, stagger) {
        const p = person.position, torsoW = person.userData.torsoW, h = person.userData.height;
        const s = stagger || [0, 0];
        poseLegWorld(person, 0, new THREE.Vector3(p.x - torsoW * 0.25, p.y + ANKLE_Y, p.z + s[0] * h));
        poseLegWorld(person, 1, new THREE.Vector3(p.x + torsoW * 0.25, p.y + ANKLE_Y, p.z + s[1] * h));
    }
    /* IKで実際に届いた手先のワールド位置（検証用） */
    function limbTipWorld(person, limb, worldTarget) {
        const S = new THREE.Vector3(); limb.anchor.getWorldPosition(S);
        const E = new THREE.Vector3(); limb.elbow.getWorldPosition(E);
        const dir = new THREE.Vector3().subVectors(worldTarget, E);
        if (dir.lengthSq() < 1e-9) return E;
        return E.addScaledVector(dir.normalize(), limb.foreLen);
    }

    /* ================= キャリーケース ================= */
    function setBar(mesh, a, b, r) {
        const dir = new THREE.Vector3().subVectors(b, a);
        const len = Math.max(dir.length(), 0.0001);
        mesh.position.copy(a).addScaledVector(dir, 0.5);
        mesh.scale.set(r, len, r);
        mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize());
    }
    function createCase(colorHex, dims) {
        const g = new THREE.Group();
        const mat = new THREE.MeshPhongMaterial({ color: colorHex });
        const darkMat = new THREE.MeshPhongMaterial({ color: 0x333333 });
        const metalMat = new THREE.MeshPhongMaterial({ color: 0xb9b9c2 });
        const H = dims.H, W = dims.W, D = dims.D;
        const body = new THREE.Mesh(new THREE.BoxGeometry(W, H, D), mat);
        g.add(body);
        const trim = new THREE.Mesh(new THREE.BoxGeometry(W * 1.01, H * 0.5, D * 1.01), new THREE.MeshPhongMaterial({ color: colorHex, transparent: true, opacity: 0.55 }));
        trim.position.y = H * 0.1;
        g.add(trim);
        // 車輪: 四隅のスピナーキャスター（台座＋車軸＋ダブルホイール）。車輪の底は -H/2 - WHEEL_DROP にそろえる
        // 車輪はジオメトリ側で軸をXに倒し、mesh.rotation.x で転がせるようにする
        const wheelR = 0.027, wheelCenterY = -H / 2 - WHEEL_DROP + wheelR;
        const wheels = [], casters = [];
        [[-1, -1], [-1, 1], [1, -1], [1, 1]].forEach(c => {
            const cx = c[0] * (W / 2 - 0.052), cz = c[1] * (D / 2 - 0.052);
            const cg = new THREE.Group(); cg.position.set(cx, 0, cz); g.add(cg); casters.push(cg); // 角ごとのキャスター一式（引く・横つけでケースを90°回した時、車輪だけ進行方向へ向け直せるように）
            const housing = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.04, 0.06), darkMat);
            housing.position.set(0, -H / 2 - 0.004, 0); cg.add(housing);
            const axle = new THREE.Mesh(new THREE.CylinderGeometry(0.006, 0.006, 0.052, 8), metalMat);
            axle.rotation.z = Math.PI / 2; axle.position.set(0, wheelCenterY, 0); cg.add(axle);
            [-1, 1].forEach(s => {
                const wheelGeo = new THREE.CylinderGeometry(wheelR, wheelR, 0.013, 16);
                wheelGeo.rotateZ(Math.PI / 2);
                const wheel = new THREE.Mesh(wheelGeo, darkMat);
                wheel.position.set(s * 0.0165, wheelCenterY, 0);
                cg.add(wheel); wheels.push(wheel);
            });
        });
        // 上面ハンドル（台座プレート＋取付部＋カプセル型グリップ）。グリップ中心は topGripLocal と同じ高さ
        const topPlate = new THREE.Mesh(new THREE.BoxGeometry(W * 0.46, 0.008, 0.09), darkMat);
        topPlate.position.set(0, H / 2 + 0.004, 0); g.add(topPlate);
        const mountGeo = new THREE.BoxGeometry(0.036, 0.032, 0.046);
        [-1, 1].forEach(s => {
            const mount = new THREE.Mesh(mountGeo, darkMat);
            mount.position.set(s * W * 0.17, H / 2 + 0.02, 0); g.add(mount);
        });
        const topGrip = new THREE.Mesh(new THREE.CapsuleGeometry(0.017, W * 0.34, 4, 10), darkMat);
        topGrip.rotation.z = Math.PI / 2;
        topGrip.position.set(0, H / 2 + 0.045, 0); g.add(topGrip);
        // 横持ち専用の長辺側グリップ（前面 +z）。縦持ちの時は表示しない
        const sideGripGroup = new THREE.Group();

/* 階段: person の position.z/y・bodyGroup.y を決め、足首目標と歩行位相(rad)を返す */
function stairFeet(person, sched, seg, tt, isB, isDown, loadKg = 0) { // loadKg: その人が持つ荷物の合計kg（重量感の演出用。持っていない人は 0 で従来どおり）
const legH = person.userData.legH, torsoW = person.userData.torsoW;
// 体のzはスケジュールの折れ点を ±0.2s のカーネルで均す（区間境界で体の前進速度が 0.4〜1.0m/s 段差になっていたのを消す。足の着地位置は絶対座標なので影響しない）
const zBody = (schedZ(sched, Math.max(0, tt - 0.2)) + 2 * schedZ(sched, tt) + schedZ(sched, Math.min(CYCLE_T, tt + 0.2))) / 4;
person.position.z = zBody;
const x = person.position.x;
const walkAmt0 = smooth01(tt / 0.9); // 歩き始めは腕の振りが滑らかに立ち上がる（下りでは te→0 の到着で 0 に戻る）
const cosY = Math.cos(person.rotation.y); // 下りで180°回転したらワールド側の左右が入れ替わる
const ankle = (i, z, top, lift) => new THREE.Vector3(x + cosY * (i === 0 ? -1 : 1) * torsoW * 0.25, top + ANKLE_Y + (lift || 0), z);
// 平地歩行ポーズ（階段区間の入口・出口でこのポーズへブレンドし、区間境界の瞬間移動を消す）
const flatCyc = isB ? 0.78 : 0.72;
const flatPose = () => {
const ph = tt * Math.PI * 2 / flatCyc;
// 振幅は区間の実速度（±0.35sで均したスケジュール速度）に合わせる: 支持足の後退速度＝体の前進速度にして平地区間のフットスケートを消す（固定振幅だと B のアプローチで 0.51m/s 滑っていた）
const tS0 = Math.max(0, tt - 0.35), tS1 = Math.min(CYCLE_T, tt + 0.35);
const vSm = (schedZ(sched, tS1) - schedZ(sched, tS0)) / Math.max(tS1 - tS0, 1e-6);
const amp = Math.max(0.07, Math.min(0.26, 0.3 * vSm * flatCyc));
const ankles = [0, 1].map(i => {
const g = gaitLeg(tt / flatCyc + i * 0.5, amp);
const az = zBody + g.z;
return ankle(i, az, rampHeightAt(az), g.lift * 0.055); // 段面はランプ（連続）で取る: スイング足が段鼻を跨ぐ瞬間の16cm跳びを消す
});
return { ankles: ankles, grpY: legH + (0.5 - 0.5 * Math.cos(2 * ph)) * 0.02, phase: ph };
};
// 足裏の高さの基準: 段鼻の手前0.10mをランプ化した段面（足の真下の面に追従する。0.12m先読み＋着地先頭打ちの旧方式は、着地位置が段鼻に近い交互足で次の段を拾い、離地直後に足首が最大8.6cm引っ張り上げられ、着地前は段面+3mmを水平に滑るホバースライドになっていた。窓を0.05mまで狭めると今度は16cmの上昇が25msに圧縮され足首が跳ねたため、0.10mに落ち着かせた）
const profAt = z => {
const h0 = heightAt(z);
if (heightAt(z + 0.10) <= h0) return h0;
let lo = 0, hi = 0.10;
for (let it = 0; it < 10; it++) { const mid = (lo + hi) / 2; if (heightAt(z + mid) > h0) hi = mid; else lo = mid; } // 10回で分解能0.3mm（6回=4.7mmではランプ目標が階段状になりケース高さが小刻みに跳ぶ）
const u = Math.max(0, 1 - hi / 0.10);
return h0 + (heightAt(z + 0.10) - h0) * (u * u * (3 - 2 * u));

const gripWorldY = Math.min(dims.H + WHEEL_DROP + 0.25, holder.userData.height * 0.575); // 横引きの実物どおり伸縮ハンドルをしっかり伸ばす: 目標はケース上面（車輪込み）＋25cm。ただし身長の57.5%を上限にし、グリップが高すぎて肘が上がる／手が届かなくなる構成を避ける
const topY = Math.max(gripWorldY - (dims.H / 2 + WHEEL_DROP), dims.H / 2 + 0.04); // 極端な構成（小柄＋L等）でもグリップがケース上面より下にはならない
setTelescopicPose(cObj, topY);
const sgn = cx >= laneOf(holder) ? 1 : -1; // 持つ人のどちらの側か（呼び出し側の cx の符号で判定）
const nx = laneOf(holder) + holder.bodyGroup.position.x + sgn * (holder.userData.torsoW * 0.45 + dims.D * 0.505 + 0.02); // 脚の外側＋ケース半厚＋隙間2cm（階段の縦持ちと同じ処方。体の横揺れにも追従）
cObj.rotation.order = 'YXZ';
cObj.rotation.set(0.01 * swayP, -sgn * Math.PI / 2, 0.012 * swayP); // ヨー90°。符号は伸縮ハンドル面（ローカル+z）が持つ人側を向く向き（グリップが肩の真下に来て左右対称になる）
cObj.position.set(nx, dims.H / 2 + WHEEL_DROP, 0.30 + 0.008 * swayP); // グリップが腰の真横に来るよう、ケース中心を人の z に揃える
cObj.userData.casters.forEach(cg => { cg.rotation.y = Math.PI / 2; }); // 車輪だけ進行方向へ向け直す（ケースを90°回しても転がる向きは前後）
} else { // 後ろに引く: 35〜40°傾けて体の後ろに離し、低い側の2輪で接地。伸縮量と z はグリップが持ち手の手元（身長×0.52 の高さ・少し後ろ）に来るよう逆算
cObj.userData.casters.forEach(cg => { cg.rotation.y = 0; });
const dims = cObj.userData.dims, topZ = cObj.userData.teleHome.topZ, th0 = 0.64;
const thB = th0 + 0.015 * swayP;
// 接地時の中心高さは θ0 での最下点を解析的に出す（Box3 実測だと車輪の回転で揺れて伸縮量がフレーム変動するため）。最終の接地は共通ループが実回転で合わせる
const cos0 = Math.cos(th0), sin0 = Math.sin(th0);
const minBody = -(dims.H / 2 * 1.01 * cos0 + dims.D / 2 * 1.01 * sin0);
const minWheel = (-dims.H / 2 - 0.008) * cos0 - (dims.D / 2 - 0.052) * sin0 - cObj.userData.wheelR;
const minHouse = (-dims.H / 2 - 0.004) * cos0 - (dims.D / 2 - 0.052) * sin0 - (0.02 * cos0 + 0.03 * sin0);
const cyG = -Math.min(minBody, minWheel, minHouse);
let topY = (holder.userData.height * 0.49 - cyG + topZ * Math.sin(th0)) / Math.cos(th0); // グリップは肩からの距離が腕の届く範囲に収まる高さ（低すぎると届かず手が浮く）
topY = Math.max(topY, dims.H / 2 + 0.08);
setTelescopicPose(cObj, topY);
cObj.rotation.set(thB, 0, 0.015 * swayP);
const gripZ = topY * Math.sin(thB) + topZ * Math.cos(thB);
cObj.position.set(cx, cyG, holder.position.z - holder.userData.height * 0.175 - gripZ + 0.01 * swayP); // ケースを少し後ろに離し、腕が後ろ下へまっすぐ届くように
// 肩→グリップ距離が腕スパンの94.5%を超える場合は伸縮を伸ばしてグリップを肩へ寄せる（伸び切り位相で肘角が跳ぶのを防ぐ。背の低い側で余裕が消えやすい）。
// 補正量は設定（持つ人・腕・ケース・身長）が変わった時だけ実測して固定する（毎フレーム変えると伸縮ハンドルの剛体性が崩れるため）
const cfgKey = holder.userData.role + '|' + armIdx + '|' + dims.H.toFixed(3) + '|' + holder.userData.height.toFixed(3);
if (cObj.userData.reachKey !== cfgKey) {
cObj.userData.reachKey = cfgKey;
holder.updateMatrixWorld(true);
const armH = holder.arms[armIdx], spanH = armH.upperLen + armH.foreLen;
const shW = new THREE.Vector3(); armH.anchor.getWorldPosition(shW);
let topYC = topY;
for (let it = 0; it < 3; it++) {
cObj.updateMatrixWorld(true);
const distG = cObj.localToWorld(cObj.userData.teleGripC.clone()).distanceTo(shW);
if (distG <= spanH * 0.945) break;
topYC = Math.min(topYC + (distG - spanH * 0.945) * 0.9, dims.H / 2 + 0.38);
setTelescopicPose(cObj, topYC);
cObj.position.z = holder.position.z - holder.userData.height * 0.175 - (topYC * Math.sin(thB) + topZ * Math.cos(thB)) + 0.01 * swayP;
}
cObj.userData.reachTopY = topYC;
}
if (cObj.userData.reachTopY !== undefined && cObj.userData.reachTopY !== topY) {
topY = cObj.userData.reachTopY;
setTelescopicPose(cObj, topY);
cObj.position.z = holder.position.z - holder.userData.height * 0.175 - (topY * Math.sin(thB) + topZ * Math.cos(thB)) + 0.01 * swayP;
}
}
spinWheels(cObj, spin);
caseJobs.push({ cObj: cObj, holder: holder, armIdx: armIdx });
};
if (one) { // 担当者が2個とも引く（左右の手に1個ずつ）
placeCase(caseAObj, carrierP, 0, laneOf(carrierP) - (layout.dimsA.W / 2 + 0.09));
placeCase(caseBObj, carrierP, 1, laneOf(carrierP) + (layout.dimsB.W / 2 + 0.09));
} else { // それぞれが自分のケースを外側の手で引く
placeCase(caseAObj, personA, 1, laneOf(personA) + (layout.dimsA.W / 2 + 0.09));
placeCase(caseBObj, personB, 0, laneOf(personB) - (layout.dimsB.W / 2 + 0.09));
}
stageGroup.updateMatrixWorld(true);
caseJobs.forEach(({ cObj }) => { // 傾けた分を補正して車輪を接地させる。当たる点は回転する車輪のAABBでなく、ケースに固定された最下点候補（車輪中心−半径／ハウジング下角／胴体下角）で決める（回転で接地高さが揺れないように）
const d = cObj.userData.dims, wr = cObj.userData.wheelR;
const cand = [];
for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
cand.push([new THREE.Vector3(sx * (d.W / 2 - 0.052), -d.H / 2 - WHEEL_DROP + wr, sz * (d.D / 2 - 0.052)), wr]);
for (const tx of [-1, 1]) cand.push([new THREE.Vector3(sx * (d.W / 2 - 0.052) + tx * 0.03, -d.H / 2 - 0.024, sz * (d.D / 2 - 0.052) + tx * 0.03), 0]);
cand.push([new THREE.Vector3(sx * d.W / 2, -d.H / 2, sz * d.D / 2), 0]);
}
cObj.updateMatrixWorld(true);
let minY = Infinity;
for (const [pt, sub] of cand) minY = Math.min(minY, pt.clone().applyMatrix4(cObj.matrixWorld).y - sub);
cObj.position.y -= minY;
});
caseGroup.updateMatrixWorld(true);
[personA, personB].forEach(person => {
[0, 1].forEach(i => {
const sg = i === 0 ? -1 : 1;
const g = gaitLeg(t / 0.95 + i * 0.5, 0.204); // 支持60% : スイング40%。振幅は支持足の後退速度が地面のスクロール速度（0.716m/s）と一致する値（2*amp/(0.6*0.95)=0.716）＝フットスケート解消
poseLegWorld(person, i, new THREE.Vector3(
person.position.x + sg * person.userData.torsoW * 0.25,
ANKLE_Y + g.lift * 0.06,
0.30 + g.z));
});
});
const errs = { A: 0, B: 0 };
const heldArms = { A: new Set(), B: new Set() };
caseJobs.forEach(({ cObj, holder, armIdx }) => {
const gripW = cObj.localToWorld(cObj.userData.teleGripC.clone());
poseArmWorld(holder, armIdx, gripW, new THREE.Vector3((armIdx === 0 ? -1 : 1) * 0.30, -0.10, -0.95)); // 肘の逃げを明示（下＋やや後ろ主体）。標準ポールだと腕が伸び切る位相で肘の向きが跳ぶため
heldArms[holder.userData.role].add(armIdx);
const e = limbTipWorld(holder, holder.arms[armIdx], gripW).distanceTo(gripW) * 1000;
if (e > errs[holder.userData.role]) errs[holder.userData.role] = e;
});
[personA, personB].forEach(person => { // 空いた手は対側の脚と逆位相に、肩からの振り子で自然に振る
[0, 1].forEach(i => {
if (heldArms[person.userData.role].has(i)) return;
const gz = gaitLeg(t / 0.95 + (i === 0 ? 0.5 : 0) - 0.045, 0.14).z; // 対側脚の前後位置に同期（位相は追従遅れぶん少し遅らせる）
const target = freeHandTarget(person, i, gz, 0.14, 1);
const yaw = person.bodyGroup.rotation.y, ca = Math.cos(-0.8 * yaw), sa = Math.sin(-0.8 * yaw);
const ox = target.x - person.position.x, oz = target.z - person.position.z;
target.x = person.position.x + ox * ca + oz * sa;
target.z = person.position.z - ox * sa + oz * ca;
poseArmWorld(person, i, target, new THREE.Vector3((i === 0 ? -1 : 1) * 0.30, -0.10, -0.95)); // 肘の逃げは外でなく下＋やや後ろ主体（外へ張り出させない）
});
});
personA.updateMatrixWorld(true); personB.updateMatrixWorld(true);
measure.mode = 'pull';
measure.loadTilt = loadTiltP;
measure.pattern = layout.pattern; measure.carrier = layout.carrier;
measure.handErrPullAMm = errs.A;
measure.handErrPullBMm = errs.B;
measure.wheelSpin = caseAObj.userData.wheels[0].rotation.x;
measure.pairCx = (personA.position.x + personB.position.x) / 2;
measure.pullPos = layout.pullPos;
measure.caseTiltA = caseAObj.rotation.x; measure.caseTiltB = caseBObj.rotation.x;
caseGroup.updateMatrixWorld(true);
const trueBottomY = cObj => { // 回転する車輪のAABB膨張を避けた実底（車輪以外はBox3、車輪は中心−半径）
const b = new THREE.Box3(); const wps = cObj.userData.wheels;
cObj.updateMatrixWorld(true);
cObj.traverse(o => { if (o.isMesh && o.visible && !wps.includes(o)) { o.geometry.computeBoundingBox(); b.union(o.geometry.boundingBox.clone().applyMatrix4(o.matrixWorld)); } });
let m = b.min.y; const wp = new THREE.Vector3();
wps.forEach(w => { w.getWorldPosition(wp); m = Math.min(m, wp.y - cObj.userData.wheelR); });
return m;
};
measure.caseMinYA = trueBottomY(caseAObj);
measure.caseMinYB = trueBottomY(caseBObj);
viewCenter.set(off, 0.85, 0);
}

function setAnimMode(mode) {
checkRadio('anim', mode);
const panelOpen = !document.getElementById('ui-panel').classList.contains('collapsed');
if (mode === 'play' && panelOpen) { animPlaying = false; return; } // パネルが開いている間は予約扱い（絶対に始まらない）。閉じた時に開始する
animPlaying = (mode === 'play');
if (animPlaying) animClock.getDelta();
}

function animate() {
requestAnimationFrame(animate);
const dt = Math.min(animClock.getDelta(), 0.05);
if (animPlaying) animTime += dt;
if (layout) applyPose(animTime);
const centerPos = viewCenter;
if (currentView === '3rd') {
camera.position.set(
centerPos.x + Math.sin(rotation.y) * camDist * Math.cos(rotation.x),
centerPos.y + Math.sin(rotation.x) * camDist,
centerPos.z + Math.cos(rotation.y) * camDist * Math.cos(rotation.x)
);
camera.lookAt(centerPos);
} else {
const self = (currentView === 'A' ? personA : personB);
// 一人称: カメラ位置は頭（headParts）のワールド位置（両目の間）、基本向きは頭のワールド向きから得た視線方向（顔の前方=ローカル+z）に一致させる
self.headParts.updateWorldMatrix(true, false);
const eyePos = self.headParts.localToWorld(new THREE.Vector3(0, self.userData.headH * 0.2, self.userData.headH * 0.55));
camera.position.copy(eyePos);
const headQ = self.headParts.getWorldQuaternion(new THREE.Quaternion());
const gaze = new THREE.Vector3(0, 0, 1).applyQuaternion(headQ); // 視線方向（ワールド）
const baseTargetRotation = new THREE.Quaternion().setFromEuler(
new THREE.Euler(Math.asin(Math.max(-1, Math.min(1, gaze.y))), Math.atan2(-gaze.x, -gaze.z), 0, 'YXZ')
); // 視線のヨー・ピッチだけを基本向きにする（ロールは持たせない）
const operationRotation = new THREE.Quaternion().setFromEuler(
new THREE.Euler(rotation.x, rotation.y, 0, 'YXZ')
);
camera.quaternion.copy(baseTargetRotation).multiply(operationRotation);
camera.rotation.z = 0; // 一人称ロールは毎フレーム0に戻す (quaternion設定後にEulerへ反映されるため明示)
}
renderer.render(scene, camera);
}
function setupControls() {
const c = document.getElementById('canvas-container');
let initialPinchDist = null;
const move = (dx, dy) => {
rotation.y -= dx * 0.005; rotation.x -= dy * 0.005;
rotation.x = Math.max(-Math.PI / 2.5, Math.min(Math.PI / 2.5, rotation.x));
};
c.addEventListener('mousedown', () => isDragging = true);
window.addEventListener('mouseup', () => isDragging = false);
window.addEventListener('mousemove', e => { if (isDragging) move(e.movementX, e.movementY);});
c.addEventListener('wheel', e => {
if (currentView === '3rd') {
camDist += e.deltaY * 0.002;
camDist = Math.max(0.5, Math.min(10, camDist));
}
}, { passive: true});
c.addEventListener('touchstart', e => {
isDragging = true;
if (e.touches.length === 1) { previousTouch = e.touches[0]; initialPinchDist = null;}
else if (e.touches.length === 2) {
initialPinchDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
}
}, { passive: false});
window.addEventListener('touchend', () => { isDragging = false; initialPinchDist = null;});
window.addEventListener('touchmove', e => {
if (!isDragging) return;
if (e.touches.length === 1 && previousTouch) {
const touch = e.touches[0];
move(touch.clientX - previousTouch.clientX, touch.clientY - previousTouch.clientY);
previousTouch = touch;
} else if (e.touches.length === 2 && initialPinchDist!== null && currentView === '3rd') {
const currentDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
const diff = currentDist - initialPinchDist;
camDist -= diff * 0.005;
camDist = Math.max(0.5, Math.min(10, camDist));
initialPinchDist = currentDist;
}
}, { passive: false});
}

function switchView() {
const order = ['3rd', 'A', 'B'];
currentView = order[(order.indexOf(currentView) + 1) % order.length];
rotation.x = 0; rotation.y = 0;
if (camera) { camera.fov = 50; camera.updateProjectionMatrix();}
document.getElementById('crosshair').style.display = currentView === '3rd'? 'none': 'block';
updateScene();
}

function shareToX() {
const nA = document.getElementById('nameA').value || 'A', nB = document.getElementById('nameB').value || 'B';
const hA = parseFloat(document.getElementById('heightA').value) || 158.0, hB = parseFloat(document.getElementById('heightB').value) || 171.5;
const modeName = { 'stairs': '階段で持つ', 'pull': '引いて歩く'}[radioVal('mode', 'stairs')];
const sizeNameOf = v => v === 'fit' ? '身の丈' : v;
const sizeNameA = sizeNameOf(radioVal('sizeA', 'fit')), sizeNameB = sizeNameOf(radioVal('sizeB', 'fit'));
const sizeName = sizeNameA === sizeNameB ? sizeNameA : `A:${sizeNameA}／B:${sizeNameB}`;
const patName = radioVal('pattern', 'one') === 'one' ? (radioVal('carrier', 'B') === 'A' ? nA + 'が2個持ち' : nB + 'が2個持ち') : 'それぞれが持つ';
window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(`${nA}(${hA.toFixed(1)}cm)と${nB}(${hB.toFixed(1)}cm)のキャリーケース体格差！（${modeName}・${patName}・${sizeName}）\n#キャリーケースシミュレーター\n${window.location.href}`)}`, '_blank');
}

init();
</script>
